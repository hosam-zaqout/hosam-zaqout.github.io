name: Build static SEO pages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate pages
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          SCRIPT=$(git ls-files '*build-static-pages.mjs' | head -1)
          if [ -z "$SCRIPT" ]; then echo "❌ build-static-pages.mjs not found in repo"; exit 1; fi
          echo "▶ Running $SCRIPT"
          node "$SCRIPT"

      - name: Commit & push if changed
        run: |
          git config user.name  "3engs-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update SEO pages and sitemap"
            git push
          fi
