# يولّد صفحات المنتجات + sitemap + llms.txt أوتوماتيك
# - كل يوم الساعة 3 الفجر بتوقيت فلسطين
# - أو يدوياً من تبويب Actions ← Run workflow
name: Build static SEO pages

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 03:00 فلسطين
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate pages
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node tools/build-static-pages.mjs

      - name: Commit & push if changed
        run: |
          git config user.name  "3engs-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "لا يوجد تغييرات"
          else
            git commit -m "🤖 تحديث صفحات المنتجات و sitemap"
            git push
          fi
