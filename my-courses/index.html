<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>دوراتي | 3ENG.s</title>
<link rel="icon" href="/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#131a2e;--line:#232c47;--txt:#e9edf7;--mut:#98a2bf;--acc:#F59E0B;--ok:#34d399}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--txt);line-height:1.8;min-height:100vh}
header{border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header a{display:flex;align-items:center;gap:8px;color:var(--txt);text-decoration:none;font-weight:900}
header img{width:32px;height:32px;border-radius:50%;background:#fff}
#who{font-size:.8rem;color:var(--mut)}
.wrap{max-width:1050px;margin:0 auto;padding:22px 16px}
h1{font-size:1.4rem;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:16/9;object-fit:contain;background:#1a2340;display:grid;place-items:center;font-size:2.6rem}
.b{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.b h3{font-size:1rem;flex:1}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.pct{font-size:.8rem;color:var(--mut)}
.btn{display:inline-block;text-align:center;background:linear-gradient(135deg,var(--acc),#D97706);color:#0b1020;padding:10px 18px;border-radius:10px;font-weight:800;text-decoration:none;border:0;cursor:pointer;font:inherit}
.btn.alt{background:#ffffff12;color:var(--txt)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;max-width:520px;margin:40px auto}
.box p{color:var(--mut);margin:10px 0}
</style>
</head>
<body>
<header><a href="/"><img src="/logo.jpg" alt="3ENG.s">3ENG.s</a><span id="who"></span></header>
<main class="wrap" id="app"><p style="text-align:center;color:var(--mut);padding:50px">جارٍ التحميل...</p></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, sendEmailVerification, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const auth = getAuth(initializeApp({ apiKey: "AIzaSyALJiF8l_wnk_6FU6etQpz44Z43lSORXQk", authDomain: "engs-website.firebaseapp.com", projectId: "engs-website", appId: "1:1028163586505:web:c09de00bb30a3369ca4018" }));
const $ = (x) => document.getElementById(x);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const login = "/auth.html?redirect=" + encodeURIComponent("https://www.3engs.com/my-courses/");
onAuthStateChanged(auth, async (user) => {
  if (!user) { $("app").innerHTML = `<div class="box"><div style="font-size:2.4rem">🎓</div><h1>دوراتي</h1><p>سجّل الدخول بالإيميل الذي اشتركت به لتظهر دوراتك.</p><a class="btn" href="${login}">🔑 تسجيل الدخول</a></div>`; return; }
  $("who").textContent = user.email;
  try {
    const r = await fetch("https://us-central1-engs-website.cloudfunctions.net/myCourses", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + await user.getIdToken() }, body: "{}" });
    const d = await r.json(); if (!r.ok) throw new Error(d.error);
    const L = d.courses || [];
    if (!L.length) { $("app").innerHTML = `<div class="box"><p>لا توجد دورات مسجلة على الإيميل <b dir="ltr">${esc(user.email)}</b>.</p>${user.emailVerified ? "" : `<p>⚠️ بريدك غير مؤكَّد، لذلك لا تظهر دوراتك. اختر أحد الحلين:</p><button class="btn" id="gl">الدخول بحساب Google (الأسرع)</button> <button class="btn alt" id="vf">📧 أرسل رابط التأكيد إلى بريدي</button><p id="vm"></p><hr style="border-color:var(--line);margin:16px 0">`}<a class="btn" href="/courses/">تصفّح الدورات</a> <button class="btn alt" id="out">الدخول بإيميل آخر</button></div>`; $("out").onclick = async () => { await signOut(auth); location.href = login; };
      $("gl")?.addEventListener("click", async () => { try { await signInWithPopup(auth, new GoogleAuthProvider().setCustomParameters({ login_hint: user.email })); location.reload(); } catch (e) { $("vm").textContent = "⚠️ " + e.message; } });
      $("vf")?.addEventListener("click", async () => { try { await sendEmailVerification(user, { url: "https://www.3engs.com/my-courses/" }); $("vm").textContent = "✅ أرسلنا رابط التأكيد إلى " + user.email + " — افتحه (وافحص Spam) ثم ارجع وحدّث الصفحة."; } catch (e) { $("vm").textContent = "⚠️ " + e.message; } });
      return; }
    $("app").innerHTML = `<h1>🎓 دوراتي</h1><div class="cards">${L.map((c) => `<div class="card">${/^https?:/.test(c.imageUrl || "") ? `<img src="${esc(c.imageUrl)}" alt="${esc(c.title)}" loading="lazy">` : `<div class="ph">${esc(c.emoji || "🎓")}</div>`}<div class="b"><h3>${esc(c.title)}</h3><div class="bar"><i style="width:${c.pct}%"></i></div><div class="pct">أنجزت ${c.pct}%</div><a class="btn" href="/learn/?item=${encodeURIComponent(c.col)}:${encodeURIComponent(c.id)}">▶️ ${c.pct ? "متابعة التعلم" : "ابدأ الآن"}</a></div></div>`).join("")}</div>`;
  } catch (e) { $("app").innerHTML = `<div class="box"><p>⚠️ تعذّر تحميل دوراتك، حاول لاحقاً.</p></div>`; }
});
</script>
</body>
</html>
