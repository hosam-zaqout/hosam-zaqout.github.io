<style>
:root{--bg:#0b1020;--card:#131a2e;--line:#232c47;--txt:#e9edf7;--mut:#98a2bf;--acc:#F59E0B;--acc2:#fbbf24;--ok:#34d399}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Cairo,system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:14px;padding:0 16px;height:58px;border-bottom:1px solid var(--line);background:#0b1020f2;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-size:1.15rem;font-weight:800;letter-spacing:.5px}
.brand b span{color:var(--acc)}
.brand small{display:block;font-size:.72rem;color:var(--mut);margin-top:-3px}
.spacer{flex:1}
.top-links{display:flex;gap:16px;font-size:.88rem;color:var(--mut)}
.top-links a:hover{color:var(--acc)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mut);padding:5px 12px;font-size:.85rem;font-weight:700}
.lang button.on{background:var(--acc);color:#1a1200}
main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--card)}
.side-head{padding:12px;border-bottom:1px solid var(--line)}
.side-head h1{font-size:1rem;margin-bottom:8px}
.side-head input{width:100%;background:#0a0f1d;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--txt);font:inherit;font-size:.88rem}
.side-head input:focus{outline:none;border-color:var(--acc)}
.lib{overflow-y:auto;flex:1;padding:6px 8px 12px}
.grp{font-size:.74rem;color:var(--mut);font-weight:800;margin:12px 6px 6px;text-transform:uppercase;letter-spacing:.5px}
.item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;background:none;border:1px solid transparent;border-radius:12px;padding:8px 10px;color:var(--txt)}
.item:hover{background:#1a2340}
.item.on{border-color:var(--acc);background:#1c2542}
.item .e{font-size:1.2rem;line-height:1.4}
.item b{display:block;font-size:.9rem}
.item small{display:block;font-size:.76rem;color:var(--mut);line-height:1.6}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.bar .title{font-weight:800;font-size:.95rem;margin-inline-end:auto}
.btn{background:#1c2542;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:6px 12px;font-size:.84rem;font-weight:700}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.main{background:var(--acc);color:#1a1200;border-color:var(--acc)}
.frame{flex:1;position:relative;background:#000;min-height:420px}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.info{padding:10px 14px;border-top:1px solid var(--line);font-size:.86rem;color:#d3d9ea;line-height:1.8;max-height:30vh;overflow:auto}
.info b{color:var(--acc2)}
.tips{display:none}
.info.tips-on .tips{display:block;margin-top:6px;color:var(--mut)}
.tips li{margin-inline-start:18px}
footer{font-size:.72rem;color:var(--mut);padding:6px 14px;border-top:1px solid var(--line);text-align:center;flex-shrink:0}
footer a{color:var(--acc)}
.libtoggle{display:none}
/* التبويبات: العناصر / الدوائر الجاهزة */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:11px 6px;font-weight:800;font-size:.9rem}
.tabs button.on{color:var(--acc2);border-bottom-color:var(--acc)}
.pane{overflow-y:auto;flex:1;padding:4px 10px 14px}
.pane[hidden]{display:none}
/* لوحة العناصر */
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.part{display:flex;flex-direction:column;align-items:center;gap:3px;background:#0f1528;border:1px solid var(--line);border-radius:12px;padding:8px 4px 6px;color:var(--txt);font-size:.72rem;font-weight:700;line-height:1.3;text-align:center;min-height:68px}
.part svg{width:46px;height:24px;color:#cbd3e6}
.part:hover{border-color:var(--acc);background:#1c2542}
.part:hover svg{color:var(--acc2)}
.part.flash{animation:fl .6s}
@keyframes fl{0%{background:#34d39955;border-color:var(--ok)}100%{background:#0f1528}}
.pal-hint{font-size:.74rem;color:var(--mut);margin:8px 2px 2px;line-height:1.7}
/* بطاقات الدوائر الجاهزة */
.ccard{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;width:100%;text-align:start;background:#0f1528;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:7px;color:var(--txt)}
.ccard:hover{border-color:var(--acc)}
.ccard.on{border-color:var(--acc);background:#1c2542;box-shadow:0 0 0 2px #F59E0B33}
.ccard .tile{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem}
.ccard b{display:block;font-size:.88rem}
.ccard small{display:block;font-size:.74rem;color:var(--mut);line-height:1.5}
.g-basics{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.g-ac{background:linear-gradient(135deg,#7c2d12,#ea580c)}
.g-power{background:linear-gradient(135deg,#14532d,#16a34a)}
.g-elec{background:linear-gradient(135deg,#581c87,#9333ea)}
.g-digital{background:linear-gradient(135deg,#134e4a,#0d9488)}
@media(max-width:860px){
  .top-links{display:none}
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{border-inline-end:0;border-bottom:1px solid var(--line);max-height:none}
  aside .tabs,aside .pane{display:none}
  aside.open .tabs{display:grid}
  aside.open .pane:not([hidden]){display:block;max-height:50vh}
  .pal{grid-template-columns:repeat(4,1fr)}
  .libtoggle{display:inline-block;margin-top:8px;width:100%}
  .frame{min-height:70vh}
  .brand small{display:none}
}
</style>
