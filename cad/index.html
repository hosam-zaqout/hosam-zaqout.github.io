<style>
:root{--bg:#0b1020;--card:#131a2e;--line:#232c47;--txt:#e9edf7;--mut:#98a2bf;--acc:#F59E0B;--acc2:#fbbf24;--ok:#34d399}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Cairo,system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:14px;padding:0 16px;height:58px;border-bottom:1px solid var(--line);background:#0b1020f2;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-size:1.15rem;font-weight:800;letter-spacing:.5px}
.brand b span{color:var(--acc)}
.brand small{display:block;font-size:.72rem;color:var(--mut);margin-top:-3px}
.spacer{flex:1}
.top-links{display:flex;gap:16px;font-size:.88rem;color:var(--mut)}
.top-links a:hover{color:var(--acc)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mut);padding:5px 12px;font-size:.85rem;font-weight:700}
.lang button.on{background:var(--acc);color:#1a1200}
main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--card)}
.side-head{padding:12px;border-bottom:1px solid var(--line)}
.side-head h1{font-size:1rem;margin-bottom:8px}
.side-head input{width:100%;background:#0a0f1d;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--txt);font:inherit;font-size:.88rem}
.side-head input:focus{outline:none;border-color:var(--acc)}
.lib{overflow-y:auto;flex:1;padding:6px 8px 12px}
.grp{font-size:.74rem;color:var(--mut);font-weight:800;margin:12px 6px 6px;text-transform:uppercase;letter-spacing:.5px}
.item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;background:none;border:1px solid transparent;border-radius:12px;padding:8px 10px;color:var(--txt)}
.item:hover{background:#1a2340}
.item.on{border-color:var(--acc);background:#1c2542}
.item .e{font-size:1.2rem;line-height:1.4}
.item b{display:block;font-size:.9rem}
.item small{display:block;font-size:.76rem;color:var(--mut);line-height:1.6}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.bar .title{font-weight:800;font-size:.95rem;margin-inline-end:auto}
.btn{background:#1c2542;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:6px 12px;font-size:.84rem;font-weight:700}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.main{background:var(--acc);color:#1a1200;border-color:var(--acc)}
.frame{flex:1;position:relative;background:#000;min-height:420px}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.info{padding:10px 14px;border-top:1px solid var(--line);font-size:.86rem;color:#d3d9ea;line-height:1.8;max-height:30vh;overflow:auto}
.info b{color:var(--acc2)}
.tips{display:none}
.info.tips-on .tips{display:block;margin-top:6px;color:var(--mut)}
.tips li{margin-inline-start:18px}
footer{font-size:.72rem;color:var(--mut);padding:6px 14px;border-top:1px solid var(--line);text-align:center;flex-shrink:0}
footer a{color:var(--acc)}
.libtoggle{display:none}
/* التبويبات: العناصر / الدوائر الجاهزة */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:11px 6px;font-weight:800;font-size:.9rem}
.tabs button.on{color:var(--acc2);border-bottom-color:var(--acc)}
.pane{overflow-y:auto;flex:1;padding:4px 10px 14px}
.pane[hidden]{display:none}
/* لوحة العناصر */
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.part{display:flex;flex-direction:column;align-items:center;gap:3px;background:#0f1528;border:1px solid var(--line);border-radius:12px;padding:8px 4px 6px;color:var(--txt);font-size:.72rem;font-weight:700;line-height:1.3;text-align:center;min-height:68px}
.part svg{width:46px;height:24px;color:#cbd3e6}
.part:hover{border-color:var(--acc);background:#1c2542}
.part:hover svg{color:var(--acc2)}
.part.flash{animation:fl .6s}
@keyframes fl{0%{background:#34d39955;border-color:var(--ok)}100%{background:#0f1528}}
.pal-hint{font-size:.74rem;color:var(--mut);margin:8px 2px 2px;line-height:1.7}
/* بطاقات الدوائر الجاهزة */
.ccard{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;width:100%;text-align:start;background:#0f1528;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:7px;color:var(--txt)}
.ccard:hover{border-color:var(--acc)}
.ccard.on{border-color:var(--acc);background:#1c2542;box-shadow:0 0 0 2px #F59E0B33}
.ccard .tile{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem}
.ccard b{display:block;font-size:.88rem}
.ccard small{display:block;font-size:.74rem;color:var(--mut);line-height:1.5}
.g-basics{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.g-ac{background:linear-gradient(135deg,#7c2d12,#ea580c)}
.g-power{background:linear-gradient(135deg,#14532d,#16a34a)}
.g-elec{background:linear-gradient(135deg,#581c87,#9333ea)}
.g-digital{background:linear-gradient(135deg,#134e4a,#0d9488)}
@media(max-width:860px){
  .top-links{display:none}
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{border-inline-end:0;border-bottom:1px solid var(--line);max-height:none}
  aside .tabs,aside .pane{display:none}
  aside.open .tabs{display:grid}
  aside.open .pane:not([hidden]){display:block;max-height:50vh}
  .pal{grid-template-columns:repeat(4,1fr)}
  .libtoggle{display:inline-block;margin-top:8px;width:100%}
  .frame{min-height:70vh}
  .brand small{display:none}
}
</style>

    ["conv-buck.txt", "⬇️", "power", "محوّل خافض (Buck)", "Buck converter", "يخفض الجهد المستمر بكفاءة عالية بالتبديل السريع وملف ومكثف.", "Steps DC voltage down efficiently using fast switching, an inductor and a capacitor."],
    ["conv-boost.txt", "⬆️", "power", "محوّل رافع (Boost)", "Boost converter", "يرفع الجهد المستمر بتخزين الطاقة في الملف وتفريغها في الخرج.", "Steps DC voltage up by storing energy in the inductor and releasing it to the output."],
    ["transswitch.txt", "🔀", "elec", "الترانزستور كمفتاح", "Transistor as a switch", "تيار صغير في القاعدة يتحكم في تيار أكبر في المجمّع لتشغيل حِمل.", "A small base current controls a larger collector current to drive a load."],
    ["amp-invert.txt", "🔺", "elec", "مضخم عاكس بمضخم العمليات", "Op-amp inverting amplifier", "الكسب يساوي سالب نسبة مقاومة التغذية الراجعة إلى مقاومة الدخل.", "Gain equals minus the ratio of the feedback resistor to the input resistor."],
    ["555square.txt", "⏲️", "elec", "المؤقت 555: موجة مربعة", "555 timer: square wave", "المؤقت 555 في الوضع المهتز يولد موجة مربعة مستمرة. <a href=\"/tools/timer-555/\">حاسبة 555</a>.", "A 555 timer in astable mode generates a continuous square wave. <a href=\"/tools/timer-555/\">555 calculator</a>."],
    ["555monostable.txt", "⏱️", "elec", "المؤقت 555: نبضة واحدة", "555 timer: monostable", "عند الإطلاق يعطي المؤقت نبضة واحدة مدتها <b>1.1 × R × C</b>.", "On trigger the 555 outputs a single pulse lasting <b>1.1 × R × C</b>."],
    ["ledflasher.txt", "💡", "elec", "وامض LED", "LED flasher", "دائرة بسيطة تجعل الثنائي الباعث للضوء يومض تلقائياً.", "A simple circuit that makes an LED blink on its own."],
    ["relay.txt", "🧲", "elec", "المرحّل (الريليه)", "Relay", "ملف مغناطيسي يفتح ويغلق تلامساً منفصلاً كهربائياً عن دائرة التحكم.", "An electromagnet opens and closes a contact isolated from the control circuit."],
    ["traffic.txt", "🚦", "digital", "إشارة مرور", "Traffic light", "دائرة منطقية تتحكم في تسلسل أضواء الإشارة.", "Logic circuitry sequencing the traffic-light lamps."],
    ["counter.txt", "🔢", "digital", "عدّاد ثنائي 4 بِت", "4-bit ripple counter", "قلّابات متتالية تعدّ النبضات بالنظام الثنائي.", "Cascaded flip-flops count pulses in binary."],
    ["7segdecoder.txt", "8️⃣", "digital", "شاشة سبع قطع", "7-segment decoder", "تحويل رقم ثنائي إلى إضاءة القطع المناسبة على الشاشة.", "Turns a binary number into the right segments on the display."]
  ];

  var $ = function (id) { return document.getElementById(id); };
  var LS = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var qs = new URLSearchParams(location.search);
  var lang = qs.get("lang") === "en" || qs.get("lang") === "ar" ? qs.get("lang") : (LS.get("cad-lang") || "ar");
  var ctz = qs.get("ctz"); // دائرة مشاركة عبر رابط
  var cur = qs.get("c") && LIB.some(function (x) { return x[0] === qs.get("c"); }) ? qs.get("c") : (ctz ? "ctz" : "voltdivide.txt");

  function simUrl(file) { return "/cad/sim/circuitjs.html?lang=" + lang + (file === "ctz" && ctz ? "&ctz=" + encodeURIComponent(ctz) : "&startCircuit=" + encodeURIComponent(file)); }
  function entry(file) { return LIB.find(function (x) { return x[0] === file; }); }

  function renderLib() {
    var q = $("q").value.trim().toLowerCase(), t = T[lang], html = "";
    Object.keys(t.groups).forEach(function (g) {
      var items = LIB.filter(function (x) { return x[2] === g && (!q || (x[3] + " " + x[4]).toLowerCase().indexOf(q) >= 0); });
      if (!items.length) return;
      html += '<div class="grp">' + t.groups[g] + "</div>";
      items.forEach(function (x) {
        var title = lang === "ar" ? x[3] : x[4], sub = (lang === "ar" ? x[5] : x[6]).replace(/<[^>]+>/g, "").split(/[.؛]/)[0];
        html += '<button type="button" class="ccard' + (x[0] === cur ? " on" : "") + '" data-file="' + x[0] + '"><span class="tile g-' + g + '">' + x[1] + "</span><span><b>" + title + "</b><small>" + sub + "</small></span></button>";
      });
    });
    $("lib").innerHTML = html;
  }
  // ───────── لوحة العناصر ─────────
  function svg(k) { return '<svg viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[k] + "</svg>"; }
  function renderParts() {
    var q = $("q").value.trim().toLowerCase(), t = T[lang], html = "";
    Object.keys(t.pgroups).forEach(function (g) {
      var items = PARTS.filter(function (p) { return p[1] === g && (!q || (p[2] + " " + p[3]).toLowerCase().indexOf(q) >= 0); });
      if (!items.length) return;
      html += '<div class="grp">' + t.pgroups[g] + '</div><div class="pal">';
      items.forEach(function (p) { html += '<button type="button" class="part" data-part="' + p[0] + '" title="' + (lang === "ar" ? p[2] : p[3]) + '">' + svg(p[0]) + "<span>" + (lang === "ar" ? p[2] : p[3]) + "</span></button>"; });
      html += "</div>";
    });
    $("parts").innerHTML = html + '<p class="pal-hint">' + t.partHint + "</p>";
  }
  // إضافة عنصر: تصدير الدائرة (XML) ← إدراج العنصر بجانبها ← إعادة الاستيراد
  // العناصر الجديدة تُرتَّب في أعمدة بجانب الدائرة: 6 عناصر في كل عمود
  var addCount = 0, base = null;
  function insertPart(key, btn) {
    var p = PARTS.find(function (x) { return x[0] === key; }), w = $("sim").contentWindow, api = w && w.CircuitJS1;
    if (!p || !api) return;
    var xml = api.exportCircuit();
    var snap = function (v) { return Math.round(v / 16) * 16; };
    if (!base) {
      var xs = [], ys = [];
      xml.replace(/ x="(-?\d+) (-?\d+) (-?\d+) (-?\d+)"/g, function (_, a, b, c, d) { xs.push(+a, +c); ys.push(+b, +d); return _; });
      base = xs.length ? { x: snap(Math.max.apply(null, xs) + 96), y: snap(Math.min.apply(null, ys)) } : { x: 192, y: 128 };
    }
    var X = base.x + Math.floor(addCount / 6) * 160, Y = base.y + (addCount % 6) * 64;
    addCount++;
    var el = partXml(p, X, Y);
    if (key === "relay" && xml.indexOf('nm="old-relay"') < 0) el = RELAY_MODEL + "\n" + el;
    if (/<cir[^>]*\/>\s*$/.test(xml)) xml = xml.replace(/\/>\s*$/, ">\n</cir>\n");
    var i = xml.search(/\n\s*<o[ >]/); if (i < 0) i = xml.lastIndexOf("</cir>");
    api.importCircuit(xml.slice(0, i) + "\n  " + el + xml.slice(i), false);
    if (btn) { btn.classList.remove("flash"); void btn.offsetWidth; btn.classList.add("flash"); }
  }
  function renderInfo() {
    var t = T[lang], x = entry(cur);
    $("curTitle").textContent = x ? (lang === "ar" ? x[3] : x[4]) : t.blank;
    $("desc").innerHTML = x ? (lang === "ar" ? x[5] : x[6]) : t.blankDesc;
    $("tips").innerHTML = t.tips.map(function (s) { return "<li>" + s + "</li>"; }).join("");
  }
  function load(file) {
    cur = file;
    $("sim").src = simUrl(file);
    $("tabBtn").href = simUrl(file);
    var u = new URL(location.href); u.searchParams.set("c", file); u.searchParams.set("lang", lang);
    history.replaceState(null, "", u.pathname + u.search);
    addCount = 0; base = null;
    renderLib(); renderParts(); renderInfo();
  }
  function setLang(l) {
    lang = l; LS.set("cad-lang", l);
    var t = T[l];
    document.documentElement.lang = l;
    document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
    document.title = t.doc;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.dataset.t] || ""; });
    $("q").placeholder = t.searchParts;
    document.querySelectorAll(".lang button").forEach(function (b) { b.classList.toggle("on", b.dataset.lang === l); });
    $("libBtn").textContent = $("side").classList.contains("open") ? t.hideLib : t.showLib;
    load(cur); // إعادة تحميل المحاكي بلغة الواجهة الجديدة
  }

  $("lib").addEventListener("click", function (e) {
    var b = e.target.closest("[data-file]"); if (!b) return;
    load(b.dataset.file);
    if (matchMedia("(max-width:860px)").matches) { $("side").classList.remove("open"); $("libBtn").textContent = T[lang].showLib; $("frame").scrollIntoView({ behavior: "smooth" }); }
  });
  $("q").addEventListener("input", function () { renderLib(); renderParts(); });
  $("parts").addEventListener("click", function (e) {
    var b = e.target.closest("[data-part]"); if (!b) return;
    insertPart(b.dataset.part, b);
    if (matchMedia("(max-width:860px)").matches) $("frame").scrollIntoView({ behavior: "smooth" });
  });
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
      $("parts").hidden = b.dataset.tab !== "parts";
      $("lib").hidden = b.dataset.tab !== "lib";
    };
  });
  document.querySelectorAll(".lang button").forEach(function (b) { b.onclick = function () { if (b.dataset.lang !== lang) setLang(b.dataset.lang); }; });
  $("newBtn").onclick = function () { load("blank.txt"); };
  $("tipsBtn").onclick = function () { $("info").classList.toggle("tips-on"); };
  $("fullBtn").onclick = function () { var f = $("frame"); (f.requestFullscreen || f.webkitRequestFullscreen || function () {}).call(f); };
  $("libBtn").onclick = function () { var s = $("side"); s.classList.toggle("open"); this.textContent = s.classList.contains("open") ? T[lang].hideLib : T[lang].showLib; };

  setLang(lang);
})();
</script>
<script>
// ───────── الحفظ والتصدير (الأدوات المتقدمة) ─────────
(function () {
  var frame = document.getElementById("sim");
  var api = function () { return frame.contentWindow && frame.contentWindow.CircuitJS1; };
  var isPro = false;
  // إظهار قائمة "ملف" داخل المحاكي للمشتركين فقط
  function applyPro() { try { frame.contentDocument.body.classList.toggle("pro", isPro); } catch (e) {} }
  frame.addEventListener("load", function () { setTimeout(applyPro, 50); setTimeout(applyPro, 1500); });
  var fname = function () { return (document.getElementById("curTitle").textContent || "3eng-cad").trim().replace(/[\/:*?"<>|]+/g, "").replace(/\s+/g, "-") || "3eng-cad"; };
  function getSvg() {
    return new Promise(function (res, rej) {
      var a = api(); if (!a) return rej(new Error("sim"));
      var t = setTimeout(function () { rej(new Error("timeout")); }, 8000);
      a.onsvgrendered = function (sim, svg) { clearTimeout(t); res(svg); };
      a.getCircuitAsSVG();
    });
  }
  function svgSize(s) { var m = s.match(/width="(\d+(?:\.\d+)?)[^"]*"[^>]*height="(\d+(?:\.\d+)?)/); return m ? [+m[1], +m[2]] : [1200, 800]; }
  window.CadProConfig = {
    kind: "schematic", slot: "proSlot", fileAccept: ".txt,.xml,text/plain",
    title: function () { return document.getElementById("curTitle").textContent || "3ENG CAD"; },
    getData: function () { return api().exportCircuit(); },
    setData: function (s) { api().importCircuit(s, false); },
    onPro: function (p) { isPro = p; applyPro(); },
    formats: [
      { ar: "📄 ملف الدائرة (.txt) — يُفتح لاحقاً من «دوائري»", en: "📄 Circuit file (.txt) — reopen from “My circuits”", run: function () { CadProUtil.download(fname() + ".txt", api().exportCircuit()); } },
      { ar: "🖼️ صورة SVG (للطباعة والتقارير)", en: "🖼️ SVG image (for print and reports)", run: function () { return getSvg().then(function (s) { CadProUtil.download(fname() + ".svg", s, "image/svg+xml"); }); } },
      { ar: "🖼️ صورة PNG", en: "🖼️ PNG image", run: function () { return getSvg().then(function (s) { var z = svgSize(s); return CadProUtil.svgToPng(s, z[0], z[1], "#ffffff"); }).then(function (b) { CadProUtil.download(fname() + ".png", b); }); } },
      { ar: "🔗 رابط مشاركة (يُنسخ تلقائياً)", en: "🔗 Share link (copied automatically)", run: function () {
          var z = frame.contentWindow.LZString.compressToEncodedURIComponent(api().exportCircuit());
          var url = "https://www.3engs.com/cad/?ctz=" + z + "&lang=" + document.documentElement.lang;
          return navigator.clipboard.writeText(url).then(function () { alert(document.documentElement.lang === "en" ? "Link copied." : "نُسخ الرابط."); }, function () { prompt("URL", url); });
        } }
    ]
  };
})();
</script>
