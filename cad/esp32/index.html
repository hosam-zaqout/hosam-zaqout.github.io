async function sendToken(force) {
  if (!user || !frame) return;

window.addEventListener("message", (ev) => {

  if (d.type === "3engs:ready") { if (d.sid) simSid = d.sid; sendToken(false); if (warm.on) warm.ready(); }
  else if (d.type === "3engs:compiled") { if (warm.on) warm.done(d); }
  else if (d.type === "3engs:quota" && d.quota) { quota = d.quota; pro = !!d.quota.pro; renderQuota(); }
  else if (d.type === "3engs:gate" && d.info) {
    if (d.info.code === "quota") { quota = { used: d.info.used, limit: d.info.limit, pro: d.info.pro }; renderQuota();
      modal(t.quotaT, t.quotaP(d.info.limit), (d.info.pro ? "" : `<a class="btn main" href="/?buy=products:tools-pro">${t.buy}</a>`) + `<button type="button" class="btn" data-close>${t.close}</button>`); }
    else if (d.info.code === "login") { sendToken(true); }
  }
});

const warm = { on: false, i: -1, log: [], timer: null, waiting: false,
  begin() {
    this.on = true; this.i = -1;
    const box = document.createElement("div");
    box.id = "warmBox";
    box.style.cssText = "position:fixed;bottom:40px;inset-inline-start:12px;z-index:9;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:10px 12px;font-size:.8rem;max-width:360px;max-height:50vh;overflow:auto;direction:ltr;text-align:left";
    document.body.appendChild(box);
    this.next();
  },
  show() {
    const ok = this.log.filter((l) => l[1] === "ok").length;
    $("warmBox").innerHTML = `<b>Warm-up ${Math.min(this.i + 1, EX.length)}/${EX.length} — ok ${ok}</b><br>` + this.log.map((l) => `${l[1] === "ok" ? "✅" : "❌"} ${l[0]} <small>${l[2]}s</small>`).reverse().join("<br>");
  },
  next() {
    clearTimeout(this.timer);
    this.i++;
    if (this.i >= EX.length) { this.on = false; this.show(); $("warmBox").insertAdjacentHTML("afterbegin", "<b>✔ DONE</b><br>"); return; }
    this.t0 = Date.now(); this.waiting = true;
    curEx = EX[this.i][0]; frame.src = simUrl(); renderEx(); this.show();
    this.timer = setTimeout(() => this.done({ state: "timeout" }), 15 * 60 * 1000);
  },
  ready() { if (!this.waiting) return; this.waiting = false; setTimeout(() => frame.contentWindow.postMessage({ type: "3engs:compile" }, SIM), 4000); },
  done(d) {
    if (this.i < 0 || this.i >= EX.length || this.log.length > this.i) return;
    this.log.push([EX[this.i][0], d.state === "done" && d.success !== false ? "ok" : "fail", Math.round((Date.now() - this.t0) / 1000)]);
    this.next();
  }
};

// ── 3ENG Gateway: local network bridge ─────────────────────────────────────
// The page relays raw network frames between the simulator server
// (wss://…/api/3engs/localnet/<tab session>) and 3ENG Gateway on this computer
// (ws://127.0.0.1:9011). The board must be (re)started after connecting.
const net = { gw: null, srv: null, state: "idle", board: false };
function netRender() {
  const t = T[lang];
  const st = { idle: t.netIdle, trying: t.netTrying, nogw: t.netNoGw, wait: t.netWaitBoard, board: t.netBoard, lost: t.netLost }[net.state] || "";
  $("netStatus").textContent = st;
  const on = net.state === "wait" || net.state === "board" || net.state === "trying";
  $("netGo").textContent = on ? t.netDisconnect : t.netConnect;
  $("netDot").textContent = net.state === "board" ? "🟢" : net.state === "wait" ? "🟡" : "";
}
function netStop(state) {
  try { net.gw && net.gw.close(); } catch (e) {}
  try { net.srv && net.srv.close(); } catch (e) {}
  net.gw = net.srv = null; net.state = state || "idle"; netRender();
}
async function netStart() {
  if (!user || !simSid) return;
  net.state = "trying"; netRender();
  const gw = new WebSocket("ws://127.0.0.1:9011");
  gw.binaryType = "arraybuffer";
  net.gw = gw;
  const opened = await new Promise((res) => { gw.onopen = () => res(true); gw.onerror = () => res(false); setTimeout(() => res(false), 6000); });
  if (!opened || net.gw !== gw) { if (net.gw === gw) netStop("nogw"); return; }
  const token = await user.getIdToken(false);
  const srv = new WebSocket(SIM.replace(/^http/, "ws") + "/api/3engs/localnet/" + encodeURIComponent(simSid) + "?t=" + encodeURIComponent(token));
  srv.binaryType = "arraybuffer";
  net.srv = srv;
  gw.onmessage = (ev) => { if (typeof ev.data !== "string" && srv.readyState === 1) srv.send(ev.data); };
  srv.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      try { const m = JSON.parse(ev.data);
        if (m.type === "ready") { net.state = "wait"; netRender(); }
        else if (m.type === "board") { net.state = m.state === "connected" ? "board" : "wait"; netRender(); }
      } catch (e) {}
      return;
    }
    if (gw.readyState === 1) gw.send(ev.data);
  };
  const lost = () => { if (net.gw === gw) netStop("lost"); };
  gw.onclose = lost; srv.onclose = lost; srv.onerror = lost;
}
$("netBtn").onclick = () => { $("netBox").hidden = false; netRender(); };
$("netClose").onclick = () => { $("netBox").hidden = true; };
$("netGo").onclick = () => { (net.state === "idle" || net.state === "nogw" || net.state === "lost") ? netStart() : netStop("idle"); };

  setInterval(() => sendToken(true), 45 * 60 * 1000); // تجديد الرمز قبل انتهائه (ساعة)
}
