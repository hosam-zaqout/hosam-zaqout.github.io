<style>
:root{--bg:#0b1020;--card:#131a2e;--line:#232c47;--txt:#e9edf7;--mut:#98a2bf;--acc:#F59E0B;--acc2:#fbbf24;--ok:#34d399;--er:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Cairo,system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit}
header{display:flex;align-items:center;gap:14px;padding:0 16px;height:58px;border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-size:1.1rem;font-weight:800}
.brand b span{color:var(--acc)}
.brand small{display:block;font-size:.72rem;color:var(--mut);margin-top:-3px}
.spacer{flex:1}
.top-links{display:flex;gap:16px;font-size:.88rem;color:var(--mut)}
.top-links a:hover{color:var(--acc)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mut);padding:5px 12px;font-size:.85rem;font-weight:700;cursor:pointer}
.lang button.on{background:var(--acc);color:#1a1200}
main{flex:1;display:grid;grid-template-columns:250px 1fr 270px;min-height:0}
aside{background:var(--card);overflow-y:auto;padding:10px}
aside.parts{border-inline-end:1px solid var(--line)}
aside.props{border-inline-start:1px solid var(--line)}
.grp{font-size:.74rem;color:var(--mut);font-weight:800;margin:10px 4px 6px}
.pal{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:#0f1528;border:1px solid var(--line);border-radius:12px;padding:7px 4px;color:var(--txt);font-size:.76rem;font-weight:700;cursor:pointer;min-height:64px;text-align:center;line-height:1.3}
.tool svg{width:54px;height:30px}
.tool:hover{border-color:var(--acc)}
.tool.on{border-color:var(--acc);background:#1c2542;box-shadow:0 0 0 2px #F59E0B44}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.bar .status{margin-inline-end:auto;font-size:.86rem;color:var(--mut)}
.bar .status b{color:var(--acc2)}
.btn{background:#1c2542;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:6px 12px;font-size:.84rem;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.danger:hover{border-color:var(--er);color:var(--er)}
.btn.main{background:var(--acc);color:#1a1200;border-color:var(--acc)}
.canvas{flex:1;overflow:auto;padding:14px;direction:ltr;display:flex;align-items:flex-start;justify-content:center;background:radial-gradient(circle at 30% 20%,#141c36,#0b1020)}
#board{width:100%;max-width:1100px;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y;direction:ltr;flex-shrink:0}
.hole{fill:#3a3f46;cursor:pointer}
.hole:hover,.hole.hi{fill:#F59E0B}
.hole.used{fill:#1f2328}
.part{cursor:pointer}
.part .hl{fill:transparent;stroke:none}
.part.sel .hl{stroke:#F59E0B;stroke-width:2.5;stroke-dasharray:4 3}
.warn{position:absolute}
.props h2{font-size:.95rem;margin:4px 2px 10px}
.prow{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:.84rem;color:var(--mut)}
.prow input,.prow select{background:#0a0f1d;border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--txt)}
.read{background:#0f1528;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;font-size:.86rem;line-height:1.9}
.read b{color:var(--acc2);direction:ltr;unicode-bidi:isolate}
.hint{font-size:.8rem;color:var(--mut);line-height:1.8}
.alert{background:#3b1d1d;border:1px solid #f8717155;border-radius:10px;padding:8px 10px;color:#fecaca;font-size:.82rem;margin:8px 0}
.alert.ok{background:#11301f;border-color:#34d39955;color:#bbf7d0}
.examples{display:flex;flex-direction:column;gap:6px;margin-top:6px}
footer{font-size:.72rem;color:var(--mut);padding:6px 14px;border-top:1px solid var(--line);text-align:center}
footer a{color:var(--acc)}
#sim{position:fixed;left:0;bottom:0;width:480px;height:320px;border:0;opacity:0;pointer-events:none;z-index:-1}
.tip{position:fixed;pointer-events:none;background:#0f1528;border:1px solid var(--acc);color:var(--txt);border-radius:8px;padding:3px 9px;font-size:.8rem;z-index:20;display:none;direction:ltr}
@media(max-width:1000px){
  .top-links{display:none}.brand small{display:none}header{padding:0 10px;gap:8px}
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  aside.parts{border:0;border-bottom:1px solid var(--line);padding:6px 8px;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  aside.parts .grp{display:none}
  aside.parts .pal{display:flex;gap:6px}
  aside.parts .tool{min-width:74px;min-height:62px;font-size:.7rem;padding:5px 3px}
  aside.parts .examples{flex-direction:row;margin:0;gap:6px}
  aside.parts .examples .btn{white-space:nowrap;font-size:.76rem;padding:6px 10px;align-self:center}
  .bar{padding:6px 8px;gap:6px}.bar .status{flex-basis:100%;font-size:.8rem;order:-1}
  .btn{padding:6px 10px}
  .canvas{padding:8px;justify-content:flex-start;-webkit-overflow-scrolling:touch}
  aside.props{border:0;border-top:1px solid var(--line);max-height:30vh;padding:8px 10px}
  .props h2{display:none}
  footer{padding:4px 10px}
}
</style>
