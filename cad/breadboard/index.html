:root{--bg:#0b1020;--card:#131a2e;--line:#232c47;--txt:#e9edf7;--mut:#98a2bf;--acc:#F59E0B;--acc2:#fbbf24;--ok:#34d399;--er:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Cairo,system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit}
header{display:flex;align-items:center;gap:14px;padding:0 16px;height:58px;border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-size:1.1rem;font-weight:800}
.brand b span{color:var(--acc)}
.brand small{display:block;font-size:.72rem;color:var(--mut);margin-top:-3px}
.spacer{flex:1}
.top-links{display:flex;gap:16px;font-size:.88rem;color:var(--mut)}
.top-links a:hover{color:var(--acc)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mut);padding:5px 12px;font-size:.85rem;font-weight:700;cursor:pointer}
.lang button.on{background:var(--acc);color:#1a1200}
main{flex:1;display:grid;grid-template-columns:250px 1fr 270px;min-height:0}
aside{background:var(--card);overflow-y:auto;padding:10px}
aside.parts{border-inline-end:1px solid var(--line)}
aside.props{border-inline-start:1px solid var(--line)}
.grp{font-size:.74rem;color:var(--mut);font-weight:800;margin:10px 4px 6px}
.pal{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:#0f1528;border:1px solid var(--line);border-radius:12px;padding:7px 4px;color:var(--txt);font-size:.76rem;font-weight:700;cursor:pointer;min-height:64px;text-align:center;line-height:1.3}
.tool svg{width:54px;height:30px}
.tool:hover{border-color:var(--acc)}
.tool.on{border-color:var(--acc);background:#1c2542;box-shadow:0 0 0 2px #F59E0B44}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.bar .status{margin-inline-end:auto;font-size:.86rem;color:var(--mut)}
.bar .status b{color:var(--acc2)}
.btn{background:#1c2542;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:6px 12px;font-size:.84rem;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.danger:hover{border-color:var(--er);color:var(--er)}
.btn.main{background:var(--acc);color:#1a1200;border-color:var(--acc)}
.canvas{flex:1;overflow:auto;padding:14px;direction:ltr;display:flex;align-items:flex-start;justify-content:center;background:radial-gradient(circle at 30% 20%,#141c36,#0b1020)}
#board{width:100%;max-width:1100px;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y;direction:ltr;flex-shrink:0}
.hole{fill:#3a3f46;cursor:pointer}
.hole:hover,.hole.hi{fill:#F59E0B}
.hole.used{fill:#1f2328}
.part{cursor:pointer}
.part .hl{fill:transparent;stroke:none}
.part.sel .hl{stroke:#F59E0B;stroke-width:2.5;stroke-dasharray:4 3}
.warn{position:absolute}
.props h2{font-size:.95rem;margin:4px 2px 10px}
.prow{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:.84rem;color:var(--mut)}
.prow input,.prow select{background:#0a0f1d;border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--txt)}
.read{background:#0f1528;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;font-size:.86rem;line-height:1.9}
.read b{color:var(--acc2);direction:ltr;unicode-bidi:isolate}
.hint{font-size:.8rem;color:var(--mut);line-height:1.8}
.alert{background:#3b1d1d;border:1px solid #f8717155;border-radius:10px;padding:8px 10px;color:#fecaca;font-size:.82rem;margin:8px 0}
.alert.ok{background:#11301f;border-color:#34d39955;color:#bbf7d0}
.examples{display:flex;flex-direction:column;gap:6px;margin-top:6px}
footer{font-size:.72rem;color:var(--mut);padding:6px 14px;border-top:1px solid var(--line);text-align:center}
footer a{color:var(--acc)}
#sim{position:fixed;left:0;bottom:0;width:480px;height:320px;border:0;opacity:0;pointer-events:none;z-index:-1}
.tip{position:fixed;pointer-events:none;background:#0f1528;border:1px solid var(--acc);color:var(--txt);border-radius:8px;padding:3px 9px;font-size:.8rem;z-index:20;display:none;direction:ltr}
@media(max-width:1000px){
  .top-links{display:none}.brand small{display:none}header{padding:0 10px;gap:8px}
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  aside.parts{border:0;border-bottom:1px solid var(--line);padding:6px 8px;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  aside.parts .grp{display:none}
  aside.parts .pal{display:flex;gap:6px}
  aside.parts .tool{min-width:74px;min-height:62px;font-size:.7rem;padding:5px 3px}
  aside.parts .examples{flex-direction:row;margin:0;gap:6px}
  aside.parts .examples .btn{white-space:nowrap;font-size:.76rem;padding:6px 10px;align-self:center}
  .bar{padding:6px 8px;gap:6px}.bar .status{flex-basis:100%;font-size:.8rem;order:-1}
  .btn{padding:6px 10px}
  .canvas{padding:8px;justify-content:flex-start;-webkit-overflow-scrolling:touch}
  aside.props{border:0;border-top:1px solid var(--line);max-height:30vh;padding:8px 10px}
  .props h2{display:none}
  footer{padding:4px 10px}
}

      if (p.kind === "pot") h += '<div class="prow">' + t("value") + ' (Ω)<select id="pVal">' + [1000, 10000, 100000].map(function (v) { return '<option value="' + v + '"' + (v === p.props.v ? " selected" : "") + ">" + v / 1000 + "k</option>"; }).join("") + '</select></div><div class="prow">' + t("position") + ' <input id="pPos" type="range" min="0" max="1" step="0.01" value="' + p.props.pos + '"></div>';
      if (p.kind === "led") h += '<div class="prow">' + t("color") + '<select id="pCol">' + ["red", "green", "blue", "yellow", "white"].map(function (c) { return '<option value="' + c + '"' + (c === p.props.color ? " selected" : "") + ">" + t(c) + "</option>"; }).join("") + "</select></div>";
      if (p.kind === "wire") h += '<div class="prow">' + t("wireColor") + '<select id="pCol">' + Object.keys(WIRE_RGB).map(function (c) { return '<option value="' + c + '"' + (c === p.props.color ? " selected" : "") + ">" + t(c) + "</option>"; }).join("") + "</select></div>";
      if (p.kind === "sw") h += '<div class="prow">' + t("state") + '<select id="pOn"><option value="1"' + (p.props.on ? " selected" : "") + ">" + t("on") + '</option><option value="0"' + (p.props.on ? "" : " selected") + ">" + t("off") + "</option></select></div>";
      if (p.kind === "button") h += '<p class="hint">' + t("pressHint") + "</p>";
      h += '<button type="button" class="btn danger" id="pDel" style="width:100%;margin-top:6px">' + t("del") + "</button>";
    }
    h += '<p class="hint" style="margin-top:12px">' + t("hover") + "<br>" + t("railNote") + "</p>";
    $("props").innerHTML = h;
    bindProps(p);
    updateLive();
  }
  // تحديث القراءات والتنبيهات فقط (يُستدعى دورياً دون إعادة بناء عناصر التحكم)
  function updateLive() {
    var a = $("liveAlert"); if (!a) return;
    var bi = (live.battery || {}).i || 0, h = "";
    if (Math.abs(bi) > 2) h = '<div class="alert">' + t("short") + "</div>";
    else if (state.parts.some(function (x) { return x.burned; })) h = '<div class="alert">' + t("burned") + "</div>";
    else if (sim.api && Math.abs(bi) > 1e-5) h = '<div class="alert ok">' + t("allGood") + "</div>";
    if (a.innerHTML !== h) a.innerHTML = h;
    var r = $("liveRead"), p = state.parts.find(function (x) { return x.id === selId; });
    if (r && p) { var L = live[p.id]; r.innerHTML = L && p.kind !== "wire" ? t("vAcross") + ": <b>" + fmt(Math.abs(L.v), "V") + "</b><br>" + t("current") + ": <b>" + fmt(Math.abs(L.i), "A") + "</b>" : ""; }
  }
  function bindProps(p) {
    var on = function (id, ev, fn) { var e = $(id); if (e) e.addEventListener(ev, fn); };
    on("pBat", "change", function () { snapshot(); state.battery = +this.value; changed(true); });
    if (!p) return;
    on("pVal", "change", function () { snapshot(); p.props.v = +this.value; changed(); });
    on("pPos", "input", function () { p.props.pos = +this.value; changed(); });
    on("pPos", "change", function () { this.blur(); });
    on("pCol", "change", function () { snapshot(); p.props.color = this.value; changed(); });
    on("pOn", "change", function () { snapshot(); p.props.on = this.value === "1"; changed(); });
    on("pDel", "click", function () { snapshot(); state.parts = state.parts.filter(function (x) { return x.id !== p.id; }); selId = null; changed(); });
  }
  function changed(redrawBoard) {
    state.parts.forEach(function (x) { delete x.burned; }); // إعادة التقييم بعد كل تعديل
    save();
    if (redrawBoard) drawBoard(); else markUsed();
    drawParts(); renderProps(); renderStatus(); runSim();
  }

  // ───────── التفاعل مع اللوحة ─────────
  function holeAt(target) { return target && target.classList && target.classList.contains("hole") ? target.dataset.h : null; }
  function place(h) {
    var used = usedHoles();
    if (KINDS[tool].leads === 3) {
      var hp = holeXY(h);
      if (RAILS.indexOf(hp.row) >= 0 || hp.col + 2 > COLS) return renderStatus(t("noRoom"));
      var hs = [h, hp.row + (hp.col + 1), hp.row + (hp.col + 2)];
      if (hs.some(function (x) { return used[x]; })) return renderStatus(t("busy"));
      snapshot();
      state.parts.push({ id: "p" + state.nextId++, kind: tool, holes: hs, props: JSON.parse(JSON.stringify(KINDS[tool].def)) });
      changed(); return;
    }
    if (used[h] || pending.indexOf(h) >= 0) return renderStatus(t("busy"));
    pending.push(h);
    if (pending.length === 2) {
      snapshot();
      state.parts.push({ id: "p" + state.nextId++, kind: tool, holes: pending.slice(), props: JSON.parse(JSON.stringify(KINDS[tool].def)) });
      pending = []; gOver.innerHTML = "";
      changed();
    } else renderStatus();
  }
  // ───────── اللمس والفأرة ─────────
  // النقرة تُحسب عند رفع الإصبع إذا لم يتحرك (حتى يبقى تمرير اللوحة على الجوال ممكناً)،
  // وتلتقط أقرب ثقب ضمن مسافة معقولة بدل اشتراط إصابة الثقب الصغير بالضبط
  var HOLES = [];
  function listHoles() { HOLES = []; gBoard.querySelectorAll(".hole").forEach(function (e) { var h = holeXY(e.dataset.h); HOLES.push({ id: e.dataset.h, x: h.x, y: h.y }); }); }
  function toSvg(cx, cy) { var pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
  function nearestHole(cx, cy) {
    var q = toSvg(cx, cy), best = null, bd = 13 * 13;
    HOLES.forEach(function (h) { var d = (h.x - q.x) * (h.x - q.x) + (h.y - q.y) * (h.y - q.y); if (d < bd) { bd = d; best = h.id; } });
    return best;
  }
  function netVoltage(h) {
    var net = holeNet(h), vv = null;
    if (sim.api && sim.find && sim.netIdx) { var root = sim.find(net); if (root in sim.netIdx) { try { vv = sim.api.getNodeVoltage("N" + sim.netIdx[root]); } catch (er) {} } }
    return vv;
  }
  function showHole(h, cx, cy) {
    var tip = $("tip");
    gBoard.querySelectorAll(".hole.hi").forEach(function (x) { x.classList.remove("hi"); });
    if (!h) { tip.style.display = "none"; return; }
    var net = holeNet(h); // تمييز الثقوب الموصولة بنفس الشريط
    gBoard.querySelectorAll(".hole").forEach(function (x) { if (holeNet(x.dataset.h) === net) x.classList.add("hi"); });
    var vv = netVoltage(h);
    tip.style.display = "block";
    tip.style.left = Math.min(cx + 14, innerWidth - 150) + "px"; tip.style.top = Math.max(cy - 40, 8) + "px";
    tip.textContent = h.toUpperCase() + (vv != null && isFinite(vv) ? "  •  " + (+vv.toFixed(2)) + " V" : "");
  }
  function drawPending(cx, cy) {
    gOver.innerHTML = "";
    if (!pending.length) return;
    var a = holeXY(pending[0]);
    el("circle", { cx: a.x, cy: a.y, r: 8, fill: "none", stroke: "#F59E0B", "stroke-width": 2.5 }, gOver);
    if (cx != null) { var q = toSvg(cx, cy); el("line", { x1: a.x, y1: a.y, x2: q.x, y2: q.y, stroke: "#F59E0B", "stroke-width": 2.5, "stroke-dasharray": "5 4" }, gOver); }
  }
  var down = null;
  svg.addEventListener("pointerdown", function (e) {
    down = { x: e.clientX, y: e.clientY, touch: e.pointerType !== "mouse" };
    if (tool !== "select") return;
    var g = e.target.closest && e.target.closest(".part");
    var p = g && state.parts.find(function (x) { return x.id === g.dataset.id; });
    // الزر يعمل ما دام مضغوطاً
    if (p && p.kind === "button") {
      selId = p.id; pressed[p.id] = true; runSim(); drawParts();
      var up = function () { pressed[p.id] = false; runSim(); drawParts(); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up); };
      window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
    }
  });
  svg.addEventListener("pointerup", function (e) {
    if (!down) return;
    var moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10, touch = down.touch; down = null;
    if (moved) return; // كان تمريراً للوحة وليس نقرة
    if (tool !== "select") { var h = nearestHole(e.clientX, e.clientY); if (h) { place(h); drawPending(); } if (touch && h) showHole(h, e.clientX, e.clientY); return; }
    var g = e.target.closest && e.target.closest(".part");
    if (!g) {
      selId = null; drawParts(); renderProps();
      if (touch) { var hh = nearestHole(e.clientX, e.clientY); showHole(hh, e.clientX, e.clientY); if (hh) setTimeout(function () { showHole(null); }, 2500); }
      return;
    }
    var p = state.parts.find(function (x) { return x.id === g.dataset.id; });
    var again = selId === p.id;
    selId = p.id;
    if (p.kind === "sw" && again) { snapshot(); p.props.on = !p.props.on; changed(); return; } // نقرة ثانية تقلب المفتاح
    drawParts(); renderProps();
    if (touch && innerWidth <= 1000) $("props").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  svg.addEventListener("pointermove", function (e) {
    if (e.pointerType !== "mouse") return;
    showHole(holeAt(e.target) || nearestHole(e.clientX, e.clientY), e.clientX, e.clientY);
    drawPending(e.clientX, e.clientY);
  });
  svg.addEventListener("pointerleave", function () { showHole(null); });
  // التكبير والتصغير (مفيد على الجوال)
  var zoom = 1;
  function applyZoom() {
    var c = document.querySelector(".canvas"), fit = c.clientWidth - 16;
    var w = Math.max(fit, innerWidth <= 1000 ? 820 : 0) * zoom;
    svg.style.width = w + "px"; svg.style.maxWidth = "none";
  }
  $("zoomIn").onclick = function () { zoom = Math.min(2.5, zoom * 1.25); applyZoom(); };
  $("zoomOut").onclick = function () { zoom = Math.max(0.5, zoom / 1.25); applyZoom(); };
  window.addEventListener("resize", applyZoom);
  $("palette").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tool]");
    if (b) { tool = b.dataset.tool; pending = []; gOver.innerHTML = ""; renderPalette(); renderStatus(); return; }
    var x = e.target.closest("[data-ex]"); if (x) { snapshot(); loadExample(x.dataset.ex); }
  });
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { pending = []; gOver.innerHTML = ""; tool = "select"; renderPalette(); renderStatus(); }
    if ((e.key === "Delete" || e.key === "Backspace") && selId && !/INPUT|SELECT/.test(document.activeElement.tagName)) { snapshot(); state.parts = state.parts.filter(function (x) { return x.id !== selId; }); selId = null; changed(); }
  });
  $("undoBtn").onclick = function () { var s = history.pop(); if (s) { state = JSON.parse(s); selId = null; changed(true); } };
  $("clearBtn").onclick = function () { if (!state.parts.length) return; snapshot(); state.parts = []; selId = null; changed(); };

  // ───────── أمثلة جاهزة ─────────
  var mk = function (kind, holes, props) { return { id: "p" + state.nextId++, kind: kind, holes: holes, props: Object.assign(JSON.parse(JSON.stringify(KINDS[kind].def)), props || {}) }; };
  function loadExample(ex) {
    var P2 = [];
    if (ex === "ex1") P2 = [mk("res", ["rt+4", "a4"], { v: 330 }), mk("led", ["c4", "c7"]), mk("wire", ["a7", "rt-7"], { color: "black" })];
    if (ex === "ex2") P2 = [mk("button", ["rt+3", "a3"]), mk("res", ["b3", "b8"], { v: 330 }), mk("led", ["d8", "d11"], { color: "green" }), mk("wire", ["a11", "rt-11"], { color: "black" })];
    if (ex === "ex3") P2 = [mk("npn", ["h14", "h15", "h16"]), mk("wire", ["j14", "rb-14"], { color: "black" }), mk("res", ["f15", "f19"], { v: 10000 }), mk("sw", ["g19", "rb+19"]), mk("res", ["rb+22", "j22"], { v: 330 }), mk("led", ["g22", "g16"], { color: "yellow" })];
    if (ex === "ex4") P2 = [mk("pot", ["e8", "e9", "e10"], { v: 10000 }), mk("wire", ["a8", "rt+8"], { color: "red" }), mk("wire", ["a10", "rt-10"], { color: "black" }), mk("res", ["c9", "c13"], { v: 220 }), mk("led", ["d13", "d16"], { color: "blue" }), mk("wire", ["a16", "rt-16"], { color: "black" })];
    state.parts = P2; selId = null; state.battery = 9; changed(true);
  }

  // ───────── اللغة والتشغيل ─────────
  function setLang(l) {
    lang = l; LS.set("cad-lang", l);
    document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr"; document.title = t("doc");
    document.querySelectorAll("[data-t]").forEach(function (e) { e.textContent = t(e.dataset.t); });
    document.querySelectorAll(".lang button").forEach(function (b) { b.classList.toggle("on", b.dataset.lang === l); });
    renderPalette(); renderProps(); renderStatus();
  }
  document.querySelectorAll(".lang button").forEach(function (b) { b.onclick = function () { setLang(b.dataset.lang); }; });

  window.BB = {
    get: function () { return JSON.stringify({ app: "3eng-breadboard", v: 1, battery: state.battery, parts: state.parts }); },
    set: function (s) {
      var d = JSON.parse(s);
      if (!d || !Array.isArray(d.parts)) throw new Error("bad file");
      snapshot();
      state.parts = d.parts.filter(function (p) { return p && KINDS[p.kind] && Array.isArray(p.holes); });
      state.battery = [3, 5, 9, 12].indexOf(d.battery) >= 0 ? d.battery : 9;
      state.nextId = state.parts.reduce(function (m, p) { var n = +String(p.id).replace(/D/g, ""); return Math.max(m, n + 1); }, 1);
      selId = null; changed(true);
    }
  };
  load();
  if (!state.parts.length) loadExample("ex1");
  drawBoard(); drawParts(); setLang(lang); applyZoom();
  // انتظار محرك المحاكاة داخل الإطار المخفي
  var wait = setInterval(function () {
    var w = $("sim").contentWindow;
    if (w && w.CircuitJS1 && w.CircuitJS1.importCircuit) { clearInterval(wait); sim.api = w.CircuitJS1; runSim(); renderStatus(); setInterval(readSim, 200); }
  }, 300);
})();
</script>
<script>
// ───────── الحفظ والتصدير (الأدوات المتقدمة) ─────────
(function () {
  var stamp = function () { return new Date().toISOString().slice(0, 10); };
  // صورة اللوحة: نسخة من SVG بألوان صريحة بدل أصناف CSS
  function boardSvg() {
    var src = document.getElementById("board"), c = src.cloneNode(true), vb = src.viewBox.baseVal;
    c.setAttribute("width", vb.width); c.setAttribute("height", vb.height); c.removeAttribute("style");
    c.querySelectorAll(".hole").forEach(function (h) { h.setAttribute("fill", h.classList.contains("used") ? "#1f2328" : "#3a3f46"); });
    c.querySelectorAll(".hl").forEach(function (h) { h.remove(); });
    var bg = document.createElementNS("http://www.w3.org/2000/svg", "rect"); bg.setAttribute("width", "100%"); bg.setAttribute("height", "100%"); bg.setAttribute("fill", "#0b1020"); c.insertBefore(bg, c.firstChild);
    return { svg: new XMLSerializer().serializeToString(c), w: vb.width, h: vb.height };
  }
  window.CadProConfig = {
    kind: "breadboard", slot: "proSlot", fileAccept: ".json,application/json",
    title: function () { return (document.documentElement.lang === "en" ? "Breadboard " : "لوحة تجارب ") + stamp(); },
    getData: function () { return window.BB.get(); },
    setData: function (s) { window.BB.set(s); },
    formats: [
      { ar: "📄 ملف اللوحة (.json) — يُفتح لاحقاً من «دوائري»", en: "📄 Board file (.json) — reopen from “My circuits”", run: function () { CadProUtil.download("3eng-breadboard-" + stamp() + ".json", window.BB.get(), "application/json"); } },
      { ar: "🖼️ صورة PNG للوحة", en: "🖼️ PNG image of the board", run: function () { var b = boardSvg(); return CadProUtil.svgToPng(b.svg, b.w, b.h, "#0b1020").then(function (png) { CadProUtil.download("3eng-breadboard-" + stamp() + ".png", png); }); } },
      { ar: "🖼️ صورة SVG للوحة", en: "🖼️ SVG image of the board", run: function () { CadProUtil.download("3eng-breadboard-" + stamp() + ".svg", boardSvg().svg, "image/svg+xml"); } }
    ]
  };
})();
</script>
<script type="module" src="/assets/cad-pro.js?v=1"></script>
