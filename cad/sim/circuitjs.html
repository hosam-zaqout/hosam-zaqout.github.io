<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="gwt:property" content="locale=en_UK">
<title>3ENG CAD — Simulator</title>

<style>
.disabled{color:lightgray}.topSpace{margin-top:12px}.cursorPointer{cursor:default}.cursorCross{cursor:crosshair}.cursorSplitter{cursor:row-resize}
.gwt-MenuItem-disabled{color:lightgray}.offScreen{position:absolute;right:101%;overflow:hidden}.gwt-Frame{border:0 !important}
.gwt-MenuItem{font-size:12px !important}.gwt-MenuBar-horizontal{font-size:12px !important}
.gwt-Label-selected{font-size:1.3em;font-weight:700;border-top:1px solid black;border-bottom:1px solid black}
.gwt-Label-1off{color:DarkGray}.gwt-Label-2off{font-size:.8em;color:LightGray}
.gwt-Button.chbut{padding:3px;margin:3px}.gwt-Button.chbut.chsel{font-weight:bold}
.gwt-Button.chbut-black{background:black;color:white}.gwt-Button.chbut-white{background:white;color:black}
.gwt-TextBox.scalebox{width:100px}
.gwt-Button.expand-but{line-height:0;font-size:13px;margin-right:5px;border-radius:0;display:inline-block;text-align:center;width:15px;height:15px;padding:0 0 1px;margin-bottom:1px;background:gray;color:white}
.topButton-red,.topButton{margin:5px 0 5px 5px;padding:5px 7px;text-decoration:none;cursor:pointer;font-size:small;border:1px solid #bbb;border-bottom:1px solid #a0a0a0;border-radius:3px}
.topButton-red{color:#fff;background-color:#ff0000}.topButton{background-color:#e7e7e7}
.radioPanel label{margin-right:15px}
body{font-family:Tahoma,Arial,sans-serif}
/* النصوص العربية: اتجاه تلقائي حسب المحتوى حتى لا تُقص في الشريط الجانبي */
.gwt-Label,.gwt-HTML,.gwt-CheckBox label,.gwt-RadioButton label,.gwt-MenuItem,.gwt-Button{unicode-bidi:plaintext}
.gwt-Label,.gwt-HTML{text-align:start;overflow-wrap:anywhere}
/* قائمة "ملف" (الحفظ والتصدير) لمشتركي الأدوات المتقدمة فقط — الصفحة الأم تضيف class="pro" */
body:not(.pro) .gwt-MenuBar-horizontal > table > tbody > tr > td.gwt-MenuItem:first-child{display:none}
</style>
<link rel="stylesheet" href="font/fontello.css">
</head>
<body>
<script>
// اختصارات الحفظ والطباعة لمشتركي الأدوات المتقدمة فقط
document.addEventListener("keydown", function (e) {
  if (document.body.classList.contains("pro")) return;
  if ((e.ctrlKey || e.metaKey) && /^[sp]$/i.test(e.key)) { e.preventDefault(); e.stopImmediatePropagation(); }
}, true);
</script>
<script src="lz-string.min.js"></script>
<script src="circuitjs110/circuitjs1.nocache.js"></script>
<iframe src="javascript:''" id="__gwt_historyFrame" style="width:0;height:0;border:0"></iframe>
</body>
</html>
