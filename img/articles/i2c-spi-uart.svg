<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Tahoma, Arial, sans-serif" font-size="14"><rect width="900" height="330" fill="#fff"/><text x="150" y="28" text-anchor="middle" fill="#1f2937" font-weight="bold" font-size="16">UART</text><text x="450" y="28" text-anchor="middle" fill="#1f2937" font-weight="bold" font-size="16">I2C</text><text x="750" y="28" text-anchor="middle" fill="#1f2937" font-weight="bold" font-size="16">SPI</text><rect x="30" y="60" width="90" height="60" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/><text x="75" y="95" text-anchor="middle" fill="#1f2937" font-weight="bold">Device A</text><rect x="180" y="60" width="90" height="60" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/><text x="225" y="95" text-anchor="middle" fill="#1f2937" font-weight="bold">Device B</text><path d="M120 80H180M180 100H120" stroke="#1f2937" stroke-width="2"/><text x="150" y="75" text-anchor="middle" fill="#1f2937" font-size="11">TX→RX</text><text x="150" y="115" text-anchor="middle" fill="#1f2937" font-size="11">RX←TX</text><text x="150" y="170" text-anchor="middle"  fill="#6b7280" font-size="12">2 wires + GND</text><text x="150" y="190" text-anchor="middle"  fill="#6b7280" font-size="12">no clock (baud rate)</text><line x1="300" y1="45" x2="300" y2="310" stroke="#e5e7eb" stroke-width="2"/><line x1="600" y1="45" x2="600" y2="310" stroke="#e5e7eb" stroke-width="2"/><rect x="320" y="60" width="100" height="50" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/><text x="370" y="90" text-anchor="middle" fill="#1f2937" font-weight="bold">Master</text><path d="M420 75H580M420 95H580" stroke="#1f2937" stroke-width="2"/><text x="560" y="70" text-anchor="middle" fill="#1f2937" font-size="11">SDA</text><text x="560" y="110" text-anchor="middle" fill="#1f2937" font-size="11">SCL</text><rect x="440" y="150" width="65" height="45" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/><text x="472.5" y="177.5" text-anchor="middle" fill="#1f2937" font-weight="bold">0x68</text><path d="M460 75V150M490 95V150" stroke="#0ea5e9" stroke-width="1.5"/><rect x="515" y="150" width="65" height="45" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/><text x="547.5" y="177.5" text-anchor="middle" fill="#1f2937" font-weight="bold">0x76</text><path d="M535 75V150M565 95V150" stroke="#0ea5e9" stroke-width="1.5"/><text x="450" y="240" text-anchor="middle"  fill="#6b7280" font-size="12">2 wires, many devices</text><text x="450" y="260" text-anchor="middle"  fill="#6b7280" font-size="12">each has an address</text><rect x="620" y="60" width="90" height="110" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/><text x="665" y="120" text-anchor="middle" fill="#1f2937" font-weight="bold">Master</text><rect x="790" y="60" width="80" height="55" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/><text x="830" y="92.5" text-anchor="middle" fill="#1f2937" font-weight="bold">Slave 1</text><rect x="790" y="140" width="80" height="55" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/><text x="830" y="172.5" text-anchor="middle" fill="#1f2937" font-weight="bold">Slave 2</text><path d="M710 75H790M710 95H790M710 115H790" stroke="#1f2937" stroke-width="2"/><path d="M750 75V215H790M760 95V235M770 115V225H790" fill="none" stroke="#1f2937" stroke-width="1.5"/><path d="M710 140H780V85H790M710 160H775V165H790" fill="none" stroke="#dc2626" stroke-width="2"/><text x="735" y="70" text-anchor="middle" fill="#1f2937" font-size="10">MOSI MISO SCK</text><text x="740" y="155" text-anchor="middle"  fill="#dc2626" font-size="10">CS1 CS2</text><text x="750" y="285" text-anchor="middle"  fill="#6b7280" font-size="12">4 wires + CS per device</text></svg>